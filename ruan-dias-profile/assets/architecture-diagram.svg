<svg width="900" height="360" viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="arch-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#121218"/>
    </linearGradient>
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8a96"/>
    </marker>
  </defs>

  <rect width="900" height="360" fill="url(#arch-bg)" rx="14"/>
  <rect x="0.5" y="0.5" width="899" height="359" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- Left: source systems -->
  <g font-family="Arial, sans-serif">
    <rect x="40" y="50" width="150" height="52" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#a78bfa" stroke-opacity="0.4"/>
    <text x="115" y="81" font-size="14" fill="#e5e5ea" text-anchor="middle">CRM (Moskit)</text>

    <rect x="40" y="154" width="150" height="52" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#a78bfa" stroke-opacity="0.4"/>
    <text x="115" y="185" font-size="14" fill="#e5e5ea" text-anchor="middle">ERP Systems</text>

    <rect x="40" y="258" width="150" height="52" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#a78bfa" stroke-opacity="0.4"/>
    <text x="115" y="289" font-size="14" fill="#e5e5ea" text-anchor="middle">Client Platforms</text>
  </g>

  <!-- connectors into hub -->
  <path d="M190,76 C260,76 260,180 360,180" fill="none" stroke="url(#line-grad)" stroke-opacity="0.55" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M190,180 L360,180" fill="none" stroke="url(#line-grad)" stroke-opacity="0.55" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M190,284 C260,284 260,180 360,180" fill="none" stroke="url(#line-grad)" stroke-opacity="0.55" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Center: integration hub -->
  <g font-family="Arial, sans-serif">
    <rect x="360" y="130" width="180" height="100" rx="14" fill="#7c3aed" fill-opacity="0.14" stroke="#a78bfa" stroke-opacity="0.6" stroke-width="1.4"/>
    <text x="450" y="172" font-size="14" font-weight="700" fill="#f5f5f7" text-anchor="middle">Integration Layer</text>
    <text x="450" y="192" font-size="11.5" fill="#c4b5fd" text-anchor="middle">REST APIs · Webhooks</text>
    <text x="450" y="208" font-size="11.5" fill="#c4b5fd" text-anchor="middle">Sync · Transformation</text>
  </g>

  <!-- connectors out of hub -->
  <path d="M540,155 C620,155 620,76 700,76" fill="none" stroke="url(#line-grad)" stroke-opacity="0.55" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M540,180 L700,180" fill="none" stroke="url(#line-grad)" stroke-opacity="0.55" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M540,205 C620,205 620,284 700,284" fill="none" stroke="url(#line-grad)" stroke-opacity="0.55" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Right: outputs -->
  <g font-family="Arial, sans-serif">
    <rect x="700" y="50" width="160" height="52" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#34d399" stroke-opacity="0.4"/>
    <text x="780" y="81" font-size="14" fill="#e5e5ea" text-anchor="middle">PostgreSQL / Supabase</text>

    <rect x="700" y="154" width="160" height="52" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#34d399" stroke-opacity="0.4"/>
    <text x="780" y="185" font-size="14" fill="#e5e5ea" text-anchor="middle">Automation (n8n)</text>

    <rect x="700" y="258" width="160" height="52" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#34d399" stroke-opacity="0.4"/>
    <text x="780" y="289" font-size="14" fill="#e5e5ea" text-anchor="middle">Internal Tools</text>
  </g>

  <text x="450" y="335" font-family="'SF Mono', monospace" font-size="12" fill="#6b6b76" text-anchor="middle">Onboarding → Mapping → Sync → Monitoring</text>
</svg>
