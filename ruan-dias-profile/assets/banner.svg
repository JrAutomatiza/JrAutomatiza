<svg width="1000" height="340" viewBox="0 0 1000 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080c"/>
      <stop offset="100%" stop-color="#111118"/>
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa">
        <animate attributeName="offset" values="0;0.5;0" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#60a5fa">
        <animate attributeName="offset" values="0.5;1;0.5" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#34d399">
        <animate attributeName="offset" values="1;1.5;1" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>

    <linearGradient id="fade-edge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#08080c" stop-opacity="1"/>
      <stop offset="12%" stop-color="#08080c" stop-opacity="0"/>
      <stop offset="88%" stop-color="#08080c" stop-opacity="0"/>
      <stop offset="100%" stop-color="#08080c" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="340" fill="url(#bg)"/>
  <rect width="1000" height="340" fill="url(#grid)"/>
  <rect width="1000" height="340" fill="url(#glow)"/>
  <rect width="1000" height="340" fill="url(#fade-edge)"/>

  <!-- top-left tag -->
  <g transform="translate(70,58)">
    <rect x="0" y="-18" width="150" height="28" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="16" cy="-4" r="4" fill="#34d399">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="30" y="0" font-family="'SF Mono', 'Fira Code', monospace" font-size="12" fill="#c9c9d4" letter-spacing="0.5">SYSTEMS ENGINEER</text>
  </g>

  <!-- main title -->
  <text x="70" y="150" font-family="'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="700" fill="#f5f5f7" letter-spacing="-2">Ruan Dias</text>

  <!-- animated gradient subtitle line -->
  <text x="70" y="200" font-family="'SF Mono', 'Fira Code', monospace" font-size="24" font-weight="500" fill="url(#text-grad)">Connecting systems that weren't built to talk.</text>

  <!-- role line -->
  <text x="70" y="238" font-family="Arial, sans-serif" font-size="16" fill="#8a8a96">Technical Implementation Engineer · Moskit CRM · Brazil</text>

  <!-- divider -->
  <line x1="70" y1="264" x2="930" y2="264" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- bottom tag row -->
  <g transform="translate(70,296)" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#8a8a96">
    <text x="0" y="0">CRM · ERP · REST APIs</text>
    <text x="215" y="0">•</text>
    <text x="235" y="0">Webhooks · Automation</text>
    <text x="445" y="0">•</text>
    <text x="465" y="0">TypeScript · Node.js</text>
  </g>

  <!-- corner bracket accents -->
  <path d="M 930 50 L 930 30 L 950 30" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5" fill="none"/>
  <path d="M 950 310 L 930 310 L 930 290" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5" fill="none"/>
</svg>
